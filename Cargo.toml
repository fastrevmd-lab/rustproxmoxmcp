[workspace]
members  = ["crates/rust-proxmoxmcp-core", "crates/rust-proxmoxmcp"]
resolver = "2"

[workspace.package]
version      = "0.3.2"
edition      = "2024"
rust-version = "1.88"
license      = "MIT"
repository   = "https://github.com/fastrevmd-lab/rustproxmoxmcp"
authors      = ["fastrevmd-lab"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "warn"

[workspace.dependencies]
anyhow      = "1"
async-trait = "0.1"
axum        = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
chrono      = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap        = { version = "4", features = ["derive"] }
http        = "1"
rmcp        = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rustls      = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
schemars    = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.11"
thiserror   = "2"
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util  = { version = "0.7", default-features = false, features = ["rt"] }
tracing     = "0.1"
url         = "2"
uuid        = { version = "1", features = ["v4"] }

# Test-only
rcgen        = "0.13"
tokio-rustls = "0.26"

# Internal workspace crate. This version must be bumped alongside
# [workspace.package] version on each release.
rust-proxmoxmcp-core = { path = "crates/rust-proxmoxmcp-core", version = "0.3.1" }

# mecmcp is consumed read-only at an exact pinned version. Do not relax the tag.
mecmcp-audit     = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-auth      = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-changeset = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-http      = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-inventory = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-job       = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-openapi   = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-runtime   = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-secret    = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-server    = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
mecmcp-transport = { version = "0.16.0", git = "https://github.com/fastrevmd-lab/mecmcp", tag = "v0.16.0" }
