name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build excludes the dev-only testing feature
        run: |
          set -euo pipefail
          tree="$(cargo tree --package rust-proxmoxmcp --no-default-features --edges normal --locked)"
          if [ -z "$tree" ]; then
            echo "ERROR: cargo tree produced no output; the guard cannot verify anything" >&2
            exit 1
          fi
          if printf '%s' "$tree" | grep -q rcgen; then
            echo "ERROR: rcgen present in the release tree — the testing feature leaked in" >&2
            exit 1
          fi
          echo "OK: testing feature excluded from the release build"
